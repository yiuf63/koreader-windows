# Sets. {{{

release: &RELEASE [
  android-.*,
  bookeen,
  cervantes,
  kindle.*,
  kobo.*,
  linux-.*,
  macos-.*,
  pocketbook.*,
  remarkable.*,
  win32,
]

pull_request: &PR [
  # emulator
  emu-.*,
  # platform
  android-arm,
  android-arm64,
  cervantes,
  kindlepw2,
  kobo,
  linux-armhf,
  macos-arm64,
  pocketbook,
  remarkable-aarch64,
  # Not built on Linux, so worth gating PRs on: it catches a change that breaks
  # the MinGW build while everything else still compiles.
  win32,
]

push: [
  *PR,
  *RELEASE,
]

# }}}

# Jobs. {{{

emulator: # {{{

  - &EMU
    id: emu-clang
    job: Emulator (Clang)
    image: koreader/kobase-clang:5.0.0-22.04
    target: ""
    env: PARALLEL_JOBS=5 USE_CLANG=1
    cache_size: 150M
    tests: true
    artifacts: false

  - <<: *EMU
    id: emu-gcc
    job: Emulator (GCC)
    image: koreader/kobase:5.0.0-22.04
    env: PARALLEL_JOBS=5
    cache_size: 240M

# }}}

android: # {{{

  - &ANDROID
    id: android-arm
    job: Android ARM
    image: koreader/koandroid:5.0.0-22.04
    env: PARALLEL_JOBS=5
    cache_size: 60M

  - <<: *ANDROID
    id: android-arm64
    job: Android ARM64

  - <<: *ANDROID
    id: android-x86
    job: Android x86

  - <<: *ANDROID
    id: android-x86_64
