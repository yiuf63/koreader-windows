    id: linux-armhf
    job: Linux ARMhf
    platform: linux/arm/v7

  - <<: *LINUX
    id: linux-x86_64
    job: Linux x86_64
    runs-on:

# }}}

macos: # {{{

  - &MACOS
    id: macos-arm64
    job: "macOS 15 ARM64 🔨16.4 🎯11.0"
    cache: macos.15_ARM64_xcode.16.4_11.0
    runs-on: macos-15
    xcode_version: "16.4"
    macosx_deployment_target: "11.0"
    env: PARALLEL_JOBS=4
    cache_size: 100MB
    target: macos
    tests: true

  - <<: *MACOS
    id: macos-x86_64
    job: "macOS 15 x86-64 🔨16.4 🎯10.15"
    cache: macos.15_x86_64_xcode.16.4_10.15
    runs-on: macos-15-intel
    macosx_deployment_target: "10.15"
    env: PARALLEL_JOBS=5

# }}}

