ShortDescription: Unofficial Windows build of KOReader, a document viewer for EPUB, PDF, DjVu and other formats.
Description: |-
  KOReader is an open-source document viewer optimised for e-ink devices. It
  supports PDF, DjVu, EPUB, FB2, CBZ, MOBI and plain text, with reflowable
  layout, dictionary lookup, highlights, and a large set of configurable
  gestures and settings.

  This is an unofficial, third-party Windows (x64) build of KOReader produced
  from the upstream source at https://github.com/koreader/koreader. Upstream
  does not publish a Windows build. It is a portable application: it unpacks
  into a folder and is launched from koreader.exe.

  This package is not affiliated with or endorsed by the KOReader project.
