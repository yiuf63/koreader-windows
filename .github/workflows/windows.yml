name: windows

# Builds and smoke-tests the native Windows target (`TARGET=win32`).
#
# This replaces upstream's `build.yml`, which builds macOS: that is the wrong
# platform for this branch and cannot be made to mean anything here (and it
# failed outright, because the base submodule is the fork rather than upstream).
#
# The build is a plain MSYS2/MinGW-w64 one, exactly as documented in
# doc/Building_Windows.md, so a green run here means the documented steps work
# from a clean checkout.

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Everything runs in the MSYS shell: the build needs MSYS's own make/cmake/
    # ninja to win the PATH race (see doc/Building_Windows.md).
    shell: msys2 {0}

jobs:

  build:

    runs-on: windows-latest

    steps:

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          # The default `path-type: strict` *replaces* PATH inside the MSYS
          # shell with MSYS2's own, which discards anything added through
          # GITHUB_PATH — leaving /mingw64/bin unreachable and the compiler
          # "not found". `inherit` keeps the converted Windows PATH, so the
          # additions below take effect.
          path-type: inherit
          # Packages are installed in the next step instead: the action's
          # `install:` runs pacman in a way whose output is not always captured,
          # and when it fails the workflow only reports a missing compiler much
          # later, with no sign of the real error.
          install: ""

      - name: Install build dependencies
        # The `mingw-w64-x86_64-toolchain` *group*, not its individual members:
        # the prefixed tool aliases (`x86_64-w64-mingw32-windres` and friends)
        # are created by the group's install, and do not belong to any single
        # package — installing gcc/binutils by name leaves them missing, and the
        # build then fails late with "windres: command not found".
        #
        # Both `cmake`/`ninja`/`meson` (the MSYS packages) and their
        # `mingw-w64-x86_64-` counterparts are needed: the build writes MSYS
        # paths into koreader_vars.cmake and into the compiler-probe scratch
        # files, and only the MSYS builds resolve those.
        run: |
          pacman --noconfirm --needed --sync \
            make git unzip zip tar bsdtar lzip cmake ninja meson \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-cmake \
            mingw-w64-x86_64-ninja \
            mingw-w64-x86_64-pkgconf \
            mingw-w64-x86_64-nasm

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # The version string comes from `git describe`, which needs the tags.
          fetch-depth: 0

      - name: Set up PATH
        # An MSYS shell has /usr/bin but not /mingw64/bin on PATH — that is the
        # MINGW64 shell's job — while the build needs the MinGW toolchain (and
        # cmake/ninja) reachable. `doc/Building_Windows.md` does this with
        # `export PATH="/usr/bin:/mingw64/bin:$PATH"`.
        #
        # The *order* matters and is not interchangeable: MSYS2 ships two cmake
        # builds, and only the MSYS one understands MSYS paths like `/d/a/...`.
        # The native one silently fails to resolve the paths the build writes
        # into `koreader_vars.cmake`, so every `include()` in the project then
        # fails with "could not find requested file" — an error that points at
        # the includes rather than at cmake.
        #
        # This goes into `GITHUB_ENV` rather than `GITHUB_PATH`: the latter is
        # prepended to the *Windows* PATH, which the MSYS launcher then
        # re-derives, so the ordering above would not be preserved.
        run: |
          env_file="$GITHUB_ENV"
          case "$env_file" in
            [A-Za-z]:*) env_file="$(cygpath -u "$env_file")" ;;
          esac
          echo "PATH=/usr/bin:/mingw64/bin:/usr/local/bin:/bin:$PATH" >> "$env_file"

      - name: Compiler version
        run: |
          set -x
          which cmake ninja make
          cmake --version | head -1
          ninja --version
          x86_64-w64-mingw32-gcc --version | head -1

      - name: Build
        # `USE_NO_CCACHE=1`: the runner ships Strawberry Perl's ccache, which the
        # build picks up via `command -v ccache`. Its path is a Windows one
        # (`C:\Strawberry\c\bin\ccache`), and passing that through the MSYS shell
        # to ninja mangles it into `\c\Strawberry\c\bin\ccache`, which fails the
        # compiler probe with "CreateProcess failed: The system cannot find the
        # file specified." There is no ccache here to benefit from anyway.
        #
        # `-j4` rather than `-j$(nproc)`: crengine has translation units that
        # each peak near 1GB, and eight at once exhausts the runner.
        run: |
          set -x
          # The build writes MSYS paths into koreader_vars.cmake, so the MSYS
          # cmake has to be the one that runs.
          which cmake
          make TARGET=win32 -j4 USE_NO_CCACHE=1
          grep -m1 CMAKE_COMMAND:INTERNAL \
            base/build/x86_64-w64-mingw32/cmake/CMakeCache.txt || true

      - name: Check binaries for missing dependencies
        # Not `make bincheck`: that target reasons about ELF sonames and looks
        # for libc.so.6. PE records dependencies by literal file name instead.
        run: tools/win32/check_dlls.sh

      - name: Check that each library ships once
        # Guards the duplication fix, and is checked on the build tree rather
        # than only the zip so a regression is reported before packaging.
        #
        # 15 libraries used to ship twice (137 MB, libtesseract alone 107 MB)
        # because `ffi/loadlib.lua` wants `lib<name>-<version>.dll` while a
        # DLL's own import table records the producer's spelling. Both are now
        # the canonical name, so one file each is enough.
        #
        # Two ways to undo that, neither of which fails at build time: link a
        # library against a producer's spelling and the second copy returns;
        # relink a dependent before its import archive is rewritten and its
        # import names a file that is not shipped, which fails only at load
        # time on a user's machine.
        run: tools/win32/check_single_copies.sh

      - name: Smoke test
        # Exercises the POSIX shim, the DLL search path and the Lua side. A
        # failure here is the class of bug that only shows up at runtime: a
        # missing `open`/`read`, an unresolvable import, a bad search path.
        run: tools/win32/ci_smoke.sh

      - name: Run spec suite
        run: tools/win32/run_specs.sh

      - name: Package
        run: make TARGET=win32 update-zip

      - name: Verify the packaged artifact
        # Test the *packaged* build, not the build tree.
        #
        # Everything above runs against the tree the build produced, where the
        # sources are symlinks into the checkout and the binaries are unstripped.
        # The zip is what users actually get, and it is a different thing: real
        # copies rather than symlinks, a release configuration, and a different
        # directory layout. A release once went out broken while every check here
        # passed, so the artifact itself is now checked.
        run: |
          set -eux
          rm -rf /tmp/ko-artifact-check
          mkdir -p /tmp/ko-artifact-check
          unzip -q koreader-win32-*.zip -d /tmp/ko-artifact-check

          # The fixes that have to survive packaging, and the delivery details.
          tools/win32/check_package.sh /tmp/ko-artifact-check/koreader

          # The zip is what carries the duplication into a release, so the
          # single-copy invariant is checked on the artifact itself rather than
          # trusting the build tree to have been packed faithfully.
          tools/win32/check_single_copies.sh /tmp/ko-artifact-check/koreader

          # And that it starts the way a user starts it: no console on the
          # parent process and no POSIX environment. Both matter — the startup
          # abort in win32.2 only happened under those conditions, and running
          # from this shell would inherit HOME and hide it.
          tools/win32/ci_smoke.sh /tmp/ko-artifact-check/koreader

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: koreader-win32
          path: koreader-win32-*.zip
          # The zip is ~200MB, mostly CJK fonts and the OCR libraries.
          compression-level: 0
