name: windows

# Builds and smoke-tests the native Windows target (`TARGET=win32`).
#
# This replaces upstream's `build.yml`, which builds macOS: that is the wrong
# platform for this branch and cannot be made to mean anything here (and it
# failed outright, because the base submodule is the fork rather than upstream).
#
# The build is a plain MSYS2/MinGW-w64 one, exactly as documented in
# doc/Building_Windows.md, so a green run here means the documented steps work
# from a clean checkout.

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Everything runs in the MSYS shell: the build needs MSYS's own make/cmake/
    # ninja to win the PATH race (see doc/Building_Windows.md).
    shell: msys2 {0}

jobs:

  build:

    # NOTE: pinned to `windows-2022`, not `windows-latest`. The 2025 image was
    #       updated to `20261103.298` and this build started hanging in CMake's
    #       compiler probe: a `cmake -G Ninja -S .../libarchive/source/` child
    #       stays alive inside `CMakeScratch/TryCompile-*` until the job is
    #       killed, while every other step of the build is finished. The last
    #       green run here was on image `20261021.278`, and the same commit
    #       produced both, so it is the image rather than the code.
    #
    #       `windows-2022` is the older image that is still supported; pinning it
    #       keeps the target buildable until the 2025 regression is understood.
    runs-on: windows-2022

    steps:

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          # The default `path-type: strict` *replaces* PATH inside the MSYS
          # shell with MSYS2's own, which discards anything added through
          # GITHUB_PATH — leaving /mingw64/bin unreachable and the compiler
          # "not found". `inherit` keeps the converted Windows PATH, so the
          # additions below take effect.
          path-type: inherit
          # Packages are installed in the next step instead: the action's
          # `install:` runs pacman in a way whose output is not always captured,
          # and when it fails the workflow only reports a missing compiler much
          # later, with no sign of the real error.
          install: ""

      - name: Install build dependencies
        # The `mingw-w64-x86_64-toolchain` *group*, not its individual members:
        # the prefixed tool aliases (`x86_64-w64-mingw32-windres` and friends)
        # are created by the group's install, and do not belong to any single
        # package — installing gcc/binutils by name leaves them missing, and the
        # build then fails late with "windres: command not found".
        #
        # Both `cmake`/`ninja`/`meson` (the MSYS packages) and their
        # `mingw-w64-x86_64-` counterparts are needed: the build writes MSYS
        # paths into koreader_vars.cmake and into the compiler-probe scratch
        # files, and only the MSYS builds resolve those.
        run: |
          pacman --noconfirm --needed --sync \
            make git unzip zip tar bsdtar lzip cmake ninja meson \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-cmake \
            mingw-w64-x86_64-ninja \
            mingw-w64-x86_64-pkgconf \
            mingw-w64-x86_64-nasm

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # The version string comes from `git describe`, which needs the tags.
          fetch-depth: 0

      - name: Set up PATH
        # An MSYS shell has /usr/bin but not /mingw64/bin on PATH — that is the
        # MINGW64 shell's job — while the build needs the MinGW toolchain (and
        # cmake/ninja) reachable. `doc/Building_Windows.md` does this with
        # `export PATH="/usr/bin:/mingw64/bin:$PATH"`.
        #
        # The *order* matters and is not interchangeable: MSYS2 ships two cmake
        # builds, and only the MSYS one understands MSYS paths like `/d/a/...`.
        # The native one silently fails to resolve the paths the build writes
        # into `koreader_vars.cmake`, so every `include()` in the project then
        # fails with "could not find requested file" — an error that points at
        # the includes rather than at cmake.
        #
        # This goes into `GITHUB_ENV` rather than `GITHUB_PATH`: the latter is
        # prepended to the *Windows* PATH, which the MSYS launcher then
        # re-derives, so the ordering above would not be preserved.
        run: |
          env_file="$GITHUB_ENV"
          case "$env_file" in
            [A-Za-z]:*) env_file="$(cygpath -u "$env_file")" ;;
          esac
          echo "PATH=/usr/bin:/mingw64/bin:/usr/local/bin:/bin:$PATH" >> "$env_file"

      - name: Compiler version
        # NOTE: the package list, not only the `--version` lines. The build here
        #       intermittently stops dead inside a `cmake` compiler probe, and it
        #       does not reproduce on a machine whose MSYS2 packages are a few
        #       revisions behind -- so the exact package revisions are the thing
        #       worth recording in the log when comparing runs.
        run: |
          set -x
          which cmake ninja make
          cmake --version | head -1
          ninja --version
          x86_64-w64-mingw32-gcc --version | head -1
          echo "=== MSYS2 package revisions ==="
          pacman -Q | grep -E '^(gcc|cmake|ninja|make|binutils|msys2-runtime|bash|filesystem) ' || true
          echo "=== mingw toolchain ==="
          pacman -Q | grep -E '^mingw-w64-x86_64-(gcc|binutils|cmake|ninja|make|crt|headers|winpthreads|libwinpthread)' || true

      - name: Build
        timeout-minutes: 330
        # `USE_NO_CCACHE=1`: the runner ships Strawberry Perl's ccache, which the
        # build picks up via `command -v ccache`. Its path is a Windows one
        # (`C:\Strawberry\c\bin\ccache`), and passing that through the MSYS shell
        # to ninja mangles it into `\c\Strawberry\c\bin\ccache`, which fails the
        # compiler probe with "CreateProcess failed: The system cannot find the
        # file specified." There is no ccache here to benefit from anyway.
        #
        # `-j1` *and* `NINJAFLAGS=-j4`, together. Either alone is wrong.
        #
        # `make -jN` (N > 1) stands up a jobserver on a pipe
        # (`--jobserver-auth=3,4`), and the configure steps here spawn `cmake`,
        # which spawns compiler probes; under MSYS2 those children do not inherit
        # the pipe, so a probe waits forever for a token nobody sends. `make`
        # itself warns `jobserver unavailable: using -j1`.
        #
        # `-j1` alone fixes that but also serialises ninja, because
        # `base/Makefile.defs` derives `PARALLEL_JOBS` from `$(ALLOCATED_CORES)`
        # and passes it down. `NINJAFLAGS` puts the parallelism back where the
        # compiling happens. Four jobs, not `$(nproc)`: crengine has translation
        # units that each peak near 1GB, so eight at once exhausts the runner.
        #
        # The attempt loop covers a stall that does happen on these runners and is
        # not in this tree: a `cmake` configure child occasionally stops dead
        # (`-- Detecting CXX compiler ABI info`) and prints nothing until the step
        # is killed. It struck once at 61 minutes into a green run and once for
        # the whole three hours of a red one; a second attempt is what turns that
        # back into a pass. `timeout` bounds each attempt so the retry gets to run.
        run: |
          set -x
          # The build writes MSYS paths into koreader_vars.cmake, so the MSYS
          # cmake has to be the one that runs.
          which cmake

          # NOTE: `NINJAFLAGS=-j2`, not `-j4`: four concurrent translation units
          #       is what sets the resource peak, and the peak is when the build
          #       stops. `/proc/meminfo` is recorded before each attempt because a
          #       fork that cannot commit is one candidate cause -- it reproduces
          #       locally on a machine that is short of memory (`MEM_COMMIT
          #       failed, Win32 error 1455`) -- and the CI log showing 13 GB free
          #       is what rules that cause out here.
          echo "=== memory before the build ==="
          # MSYS2 has no `free`; /proc/meminfo is the one that exists.
          head -5 /proc/meminfo || true

          # Run one attempt, and stop it as soon as it is either out of time or
          # visibly stuck.
          #
          # `timeout(1)` alone does not even do the first part: it signals its
          # direct child, and this build's children are `make` -> `ninja` ->
          # `cc1plus`/`cmake`. The first attempt's `timeout` fired at 60 minutes
          # and left the ninja and compiler processes alive, so the second `make`
          # inherited a half-built directory and blocked behind them -- the log
          # then shows nothing but the heartbeat's own `+ sleep 30` until the step
          # is killed. Reproduced: `timeout --signal=TERM 3 bash -c 'sleep 300 &
          # wait'` returns but leaves `sleep` running; `setsid` plus `kill -- -PID`
          # takes the group with it.
          #
          # The stall check: a hung build looks identical from the outside every
          # 30 seconds -- same processes, same state -- while a working one moves
          # through projects and its process set changes. If the fingerprint holds
          # still for STALL_MINUTES, stop that attempt and report, so the retry
          # starts in seconds instead of after the full limit. `-j2` lets a
          # compile hold a slot for a while, so the window is generous; the hang
          # it must catch sits unchanged for an hour.
          STALL_MINUTES="${STALL_MINUTES:-5}"

          # `LC_ALL=C` because the command lines can contain non-ASCII (the tree
          # has UTF-8 paths) and `sort` errors out on those under the runner's
          # locale, which would make every sample differ and the check never fire.
          # `/proc/${pid}` can also vanish between `ps` and the read; an empty
          # line for it is fine, it just must not break the pipeline.
          fingerprint() {
            ps 2>/dev/null | tail -n +2 | while read -r pid _; do
              printf '%s %s\n' \
                "$(sed -n 's/^State:\s*//p' "/proc/${pid}/status" 2>/dev/null | cut -c1)" \
                "$(tr '\0' ' ' < "/proc/${pid}/cmdline" 2>/dev/null | cut -c1-80)"
            done | LC_ALL=C sort
          }

          run_attempt() {
            limit=$1; shift
            setsid "$@" &
            local pgid=$!
            local stall_ticks=$(( STALL_MINUTES * 2 ))
            (
              ticks=0
              stuck=0
              last=""
              while :; do
                sleep 30
                ticks=$((ticks + 1))
                now=$(fingerprint)
                if [ -n "${last}" ] && [ "${now}" = "${last}" ]; then
                  stuck=$((stuck + 1))
                else
                  stuck=0
                  last="${now}"
                fi
                if [ "${stuck}" -ge "${stall_ticks}" ]; then
                  echo "=== no process change for ${STALL_MINUTES} minutes; stopping this attempt ===" >&2
                  echo "${now}" >&2
                  kill -TERM -- "-${pgid}" 2>/dev/null || true
                  sleep 5
                  kill -KILL -- "-${pgid}" 2>/dev/null || true
                  exit 0
                fi
                if [ "${ticks}" -ge "$(( limit / 30 ))" ]; then
                  kill -TERM -- "-${pgid}" 2>/dev/null || true
                  sleep 5
                  kill -KILL -- "-${pgid}" 2>/dev/null || true
                  exit 0
                fi
              done
            ) &
            local watcher=$!
            wait "${pgid}"; local rc=$?
            kill "${watcher}" 2>/dev/null || true
            return "${rc}"
          }

          # The process tree, to a file. Ninja buffers a command's output until
          # the command exits, so a command that hangs writes nothing and the
          # build log cannot name it. This can, and it records `State` plus the
          # open descriptors: an `S` process is waiting on something and the fds
          # say on what, an `R` one spinning is a different bug, a `Z` means the
          # parent stopped reaping. cwd alone only says where it was.
          heartbeat_log="${RUNNER_TEMP:-/tmp}/build-heartbeat.log"
          : > "${heartbeat_log}"
          (
            while :; do
              sleep 30
              tools/win32/dump-process-state.sh >> "${heartbeat_log}" 2>&1 || true
            done
          ) &
          heartbeat=$!
          trap 'kill "${heartbeat}" 2>/dev/null || true' EXIT

          # A stall costs one attempt, so the budget is spent on attempts rather
          # than on one long one. The stall is a single `cmake` that parks inside
          # its own `CMakeScratch/TryCompile-*` directory and never returns; the
          # same probe takes 3.6 seconds here. It is not memory (the runner
          # reports 13 GB free), not `gendef` (it succeeds on every library), not
          # two configures colliding (the heartbeat caught exactly one `cmake`
          # process), and not the toolchain (gcc 16.1/16.2 and cmake 4.3/4.4/4.5
          # all build this tree locally). What is left is that it is intermittent
          # on the runner, so more attempts is what actually raises the odds.
          #
          # Five attempts of 50 minutes: a clean build takes well under that (the
          # one green run did the whole job in 14 minutes at -j4), and GitHub
          # caps a job at six hours, so this fits with room to spare.
          max_attempts=5
          attempt=1
          while [ "${attempt}" -le "${max_attempts}" ]; do
            echo "=== build attempt ${attempt}/${max_attempts} ==="
            if run_attempt 3000 \
                 make TARGET=win32 -j1 NINJAFLAGS=-j2 USE_NO_CCACHE=1; then
              break
            fi
            echo "=== last processes seen, attempt ${attempt} ==="
            # The last sample, plus the state and descriptors that name what it
            # was waiting on. `awk` keeps only the final block, so a run of 60
            # identical samples does not bury it.
            awk '/^=== /{buf=""} {buf = buf $0 "\n"} END{printf "%s", buf}' \
              "${heartbeat_log}" || true
            echo "=== memory after attempt ${attempt} ==="
            head -5 /proc/meminfo || true
            attempt=$((attempt + 1))
            if [ "${attempt}" -gt "${max_attempts}" ]; then
              echo "build failed ${max_attempts} times; giving up" >&2
              exit 1
            fi
            echo "attempt ${attempt} of ${max_attempts}; retrying" >&2
          done
          grep -m1 CMAKE_COMMAND:INTERNAL \
            base/build/x86_64-w64-mingw32/cmake/CMakeCache.txt || true

      - name: Check binaries for missing dependencies
        # Not `make bincheck`: that target reasons about ELF sonames and looks
        # for libc.so.6. PE records dependencies by literal file name instead.
        run: tools/win32/check_dlls.sh

      - name: Check that each library ships once
        # Guards the duplication fix, and is checked on the build tree rather
        # than only the zip so a regression is reported before packaging.
        #
        # 15 libraries used to ship twice (137 MB, libtesseract alone 107 MB)
        # because `ffi/loadlib.lua` wants `lib<name>-<version>.dll` while a
        # DLL's own import table records the producer's spelling. Both are now
        # the canonical name, so one file each is enough.
        #
        # Two ways to undo that, neither of which fails at build time: link a
        # library against a producer's spelling and the second copy returns;
        # relink a dependent before its import archive is rewritten and its
        # import names a file that is not shipped, which fails only at load
        # time on a user's machine.
        run: tools/win32/check_single_copies.sh

      - name: Smoke test
        # Exercises the POSIX shim, the DLL search path and the Lua side. A
        # failure here is the class of bug that only shows up at runtime: a
        # missing `open`/`read`, an unresolvable import, a bad search path.
        run: tools/win32/ci_smoke.sh

      - name: Load and call into every FFI library
        # The spec suite cannot see the import tables, and the single-copy check
        # reads them without loading anything. This is the one that actually
        # loads each library through the frontend's own wrappers and calls into
        # them, so a library that loads but is missing symbols is caught here
        # rather than as a nil call somewhere in the reader.
        run: tools/win32/check_ffi_libs.sh

      - name: Run spec suite
        run: tools/win32/run_specs.sh

      - name: Package
        run: make TARGET=win32 update-zip

      - name: Verify the packaged artifact
        # Test the *packaged* build, not the build tree.
        #
        # Everything above runs against the tree the build produced, where the
        # sources are symlinks into the checkout and the binaries are unstripped.
        # The zip is what users actually get, and it is a different thing: real
        # copies rather than symlinks, a release configuration, and a different
        # directory layout. A release once went out broken while every check here
        # passed, so the artifact itself is now checked.
        run: |
          set -eux
          rm -rf /tmp/ko-artifact-check
          mkdir -p /tmp/ko-artifact-check
          unzip -q koreader-win32-*.zip -d /tmp/ko-artifact-check

          # The fixes that have to survive packaging, and the delivery details.
          tools/win32/check_package.sh /tmp/ko-artifact-check/koreader

          # The zip is what carries the duplication into a release, so the
          # single-copy invariant is checked on the artifact itself rather than
          # trusting the build tree to have been packed faithfully.
          tools/win32/check_single_copies.sh /tmp/ko-artifact-check/koreader

          # And that it starts the way a user starts it: no console on the
          # parent process and no POSIX environment. Both matter — the startup
          # abort in win32.2 only happened under those conditions, and running
          # from this shell would inherit HOME and hide it.
          tools/win32/ci_smoke.sh /tmp/ko-artifact-check/koreader

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: koreader-win32
          path: koreader-win32-*.zip
          # The zip is ~200MB, mostly CJK fonts and the OCR libraries.
          compression-level: 0
